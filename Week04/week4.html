<!-- Why flexbox?
    Normally HTML elements stack vertically,
    flexbox gives us an easier way to control how elements are arranges in a container -->

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>
<!-- Flex containers vs Flex Items-->

<section class="cards">
    <div>Game 1</div>
    <div>Game 2</div>
    <div>Game 3</div>
    <div>Game 1</div>
    <div>Game 2</div>
    <div>Game 3</div>
</section>

<!-- Flexbox container is the section
 Divs are the items -->
