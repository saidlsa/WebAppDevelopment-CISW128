<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games — DOM Homework</title>
  <style>
    .[yourHighlightClass] { background: #fff3cd; transition: background 200ms; }
    .[yourDarkClass] { background:#111; color:#eee; }
  </style>
</head>
<body>
  <header>
    <h1 id="[yourTitleId]">[Your Theme] Page</h1>
  </header>

  <main id="[yourMainId]">
    <p class="[yourIntroClass]">Welcome! This page will update with JavaScript.</p>

    <!-- List target you will render into -->
    <ul id="[yourListId]"></ul>

    <!-- Image you will update -->
    <img id="[yourImgId]" src="https://via.placeholder.com/400x200" alt="[placeholder]" />

    <!-- Buttons you will wire up -->
    <button id="[yourToggleBtnId]">Toggle Highlight</button>
    <button id="[yourSwapBtnId]">Swap Image</button>
  </main>

  <footer id="game_footer">© 2025 Said Querevalu</footer>

  <script src="scripts.js"></script>
</body>
</html>
