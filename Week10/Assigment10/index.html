<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MY PETS — DOM Homework</title>
  <style>
    body { font-family: 'Times New Roman', Times, serif; max-width: 700px; margin: 0 auto; padding: 16px; transition: background 200ms, color 200ms; }
    img { max-width: 100%; height: 260px; object-fit: cover; border-radius: 8px; display: block; margin: 12px 0; }
    button { padding: 8px 12px; margin: 4px 4px 4px 0; cursor: pointer; }

    /* Highlight class (toggled on/off via the button) */
    .petHighlight { background: #c2d3e0; transition: background 200ms; }

    /* Dark mode class (toggled on/off on document.body) */
    .petDark { background: #111; color: #eee; }
    .petDark .petHighlight { color: #111; }
  </style>
</head>
<body>
  <header>
    <h1 id="petTitle">My pets Page</h1>
  </header>

  <main id="petMain">
    <p class="petIntro">Welcome! This page will be updated using JavaScript.</p>

    <!-- List where the pets are rendered -->
    <ul id="petList"></ul>

    <!-- Image that updates using JavaScript -->
    <img id="petImg" src="images/Canela.jpg" alt="Initial photo" />
    <p id="petCaption"></p>

    <!-- Buttons -->
    <button id="petToggleBtn">Toggle Highlight</button>
    <button id="petSwapBtn">Swap Image</button>
    <button id="petDarkBtn">Dark mode</button>

    <!-- Part 9: Independent challenge paragraph -->
    <p id="petChallenge">This text will change using JavaScript.</p>
  </main>

  <footer id="petFooter">© 2025 Said Querevalu</footer>

  <script src="scripts.js"></script>
</body>
</html>
